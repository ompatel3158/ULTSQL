name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze bin lib --no-fatal-warnings

      - name: Run Unit & Integration Tests
        run: flutter test test/developer_features_test.dart test/reactive_streams_test.dart test/telemetry_flight_recorder_test.dart test/phase_3_4_5_all_features_test.dart test/universal_bindings_test.dart
