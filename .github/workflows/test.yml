name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze bin lib

      - name: Run Unit Tests
        run: flutter test test/tier_spec_test.dart test/complete_engine_final_test.dart test/six_pillars_enterprise_test.dart test/signature_innovations_test.dart test/memory_benchmark_test.dart test/engine_test.dart test/brutal_stress_test.dart
