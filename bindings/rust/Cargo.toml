[package]
name = "ultsql"
version = "1.0.19"
edition = "2021"
description = "Official asynchronous Rust client for the UltSQL multimodal database engine."
license = "BSD-3-Clause"
repository = "https://github.com/ompatel3158/ULTSQL"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
