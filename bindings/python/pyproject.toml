[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultsql"
version = "1.0.19"
description = "Universal Python client for the UltSQL 100% Pure-Dart multimodal database engine."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Om Patel", email = "ompatel3158@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers"
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/ompatel3158/ULTSQL"
Documentation = "https://pub.dev/packages/ultsql"
Repository = "https://github.com/ompatel3158/ULTSQL"
Issues = "https://github.com/ompatel3158/ULTSQL/issues"

[project.scripts]
ultsql-server = "ultsql.server:main"

[tool.setuptools.packages.find]
where = ["src"]
