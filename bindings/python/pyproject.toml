[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultsql"
version = "1.0.15"
description = "Universal Python client for the UltSQL 100% Pure-Dart multimodal database engine."
readme = "README.md"
authors = [
  { name = "Om Patel", email = "ompatel3158@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers"
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/ompatel3158/ULTSQL"
Documentation = "https://pub.dev/packages/ultsql"
Repository = "https://github.com/ompatel3158/ULTSQL"
