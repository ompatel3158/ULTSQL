<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100">
  <defs>
    <mask id="logo-hole-mask">
      <rect x="0" y="0" width="380" height="100" fill="#ffffff" />
      <circle cx="50" cy="50" r="5.5" fill="#000000" />
    </mask>
  </defs>

  <!-- Propeller Icon with merged central hub and center hole mask -->
  <g mask="url(#logo-hole-mask)">
    <!-- Central Hub -->
    <circle cx="50" cy="50" r="13.5" fill="#ffffff" />
    <!-- Top Petal -->
    <ellipse cx="50" cy="26" rx="11" ry="20" fill="#ffffff" />
    <!-- Bottom Left Petal -->
    <g transform="rotate(120 50 50)">
      <ellipse cx="50" cy="26" rx="11" ry="20" fill="#ffffff" />
    </g>
    <!-- Bottom Right Petal -->
    <g transform="rotate(240 50 50)">
      <ellipse cx="50" cy="26" rx="11" ry="20" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography -->
  <text x="115" y="56" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">ULTSQL</text>
  <text x="117" y="78" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cccccc" letter-spacing="1.5">THREE MODELS, ONE CORE</text>
</svg>
