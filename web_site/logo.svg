<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- Propeller Icon -->
  <g transform="translate(10, 0)">
    <g transform="translate(50, 50)">
      <!-- Top Blade -->
      <path d="M 0,-5 C -13,-14 -14,-40 0,-45 C 14,-40 13,-14 0,-5 Z" fill="currentColor" />
      <!-- Bottom Left Blade -->
      <path d="M 0,-5 C -13,-14 -14,-40 0,-45 C 14,-40 13,-14 0,-5 Z" transform="rotate(120)" fill="currentColor" />
      <!-- Bottom Right Blade -->
      <path d="M 0,-5 C -13,-14 -14,-40 0,-45 C 14,-40 13,-14 0,-5 Z" transform="rotate(240)" fill="currentColor" />
      <!-- Center Hole Circle cutout -->
      <circle cx="0" cy="0" r="5.5" fill="var(--svg-bg, #09090b)" />
    </g>
  </g>

  <!-- Typography -->
  <text x="120" y="55" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="700" fill="currentColor" letter-spacing="-1.5">ultsql</text>
  <text x="122" y="75" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="currentColor" opacity="0.7" letter-spacing="-0.2">three models, one core</text>
</svg>
