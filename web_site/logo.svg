<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 480 136" fill="none">
  <!-- 3-Petal Pinwheel Logo (Padded 0% cropping) -->
  <g transform="translate(54, 54) scale(2.4) translate(-54, -54)">
    <g fill="#FFFFFF">
      <!-- Petal 1 (0 deg) -->
      <path d="M 54,35.5 A 4.2,10.1 0 1,1 54,55.7 A 4.2,10.1 0 1,1 54,35.5 Z" />
      
      <!-- Petal 2 (120 deg) -->
      <path d="M 54,35.5 A 4.2,10.1 0 1,1 54,55.7 A 4.2,10.1 0 1,1 54,35.5 Z" transform="rotate(120, 54, 54)" />
      
      <!-- Petal 3 (240 deg) -->
      <path d="M 54,35.5 A 4.2,10.1 0 1,1 54,55.7 A 4.2,10.1 0 1,1 54,35.5 Z" transform="rotate(240, 54, 54)" />
    </g>

    <!-- Center Core Cutout -->
    <circle cx="54" cy="54" r="2" fill="#000000" />
  </g>

  <!-- Typography -->
  <text x="135" y="60" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">ULTSQL</text>
  <text x="137" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#CCCCCC" letter-spacing="1.5">THREE MODELS, ONE CORE</text>
</svg>
