<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="icon-hole-mask">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      <circle cx="50" cy="50" r="5.5" fill="#000000" />
    </mask>
  </defs>
  
  <g mask="url(#icon-hole-mask)">
    <!-- Central Hub -->
    <circle cx="50" cy="50" r="13.5" fill="#ffffff" />
    <!-- Top Petal -->
    <ellipse cx="50" cy="26" rx="11" ry="20" fill="#ffffff" />
    <!-- Bottom Left Petal -->
    <g transform="rotate(120 50 50)">
      <ellipse cx="50" cy="26" rx="11" ry="20" fill="#ffffff" />
    </g>
    <!-- Bottom Right Petal -->
    <g transform="rotate(240 50 50)">
      <ellipse cx="50" cy="26" rx="11" ry="20" fill="#ffffff" />
    </g>
  </g>
</svg>
